<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Icon — preview</title>
<style>
  body { padding: var(--space-5); }
  #g { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: var(--space-1); }
  #g div { display: flex; align-items: center; gap: var(--space-2); height: var(--size-control); padding: 0 var(--space-2); border-radius: var(--radius-sm); color: var(--ink-1); min-width: 0; }
  #g div:hover { background: var(--fill-rest); }
  #g span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-3); font-family: var(--font-mono); font-size: 11px; }
</style></head>
<body>
<div id="g"></div>
<script>
  var B = Bowerbird;
  document.getElementById('g').innerHTML = B.icons.map(function (n) { return '<div title="' + n + '">' + B.icon(n) + '<span>' + n + '</span></div>'; }).join('');
</script>
</body>
</html>
