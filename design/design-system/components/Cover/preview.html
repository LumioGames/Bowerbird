<!-- @dsCard height=288 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Bowerbird</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-panel); color: var(--ink-1); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  /* the composition lives in a 480-wide box on the right half of the 960 layout, clear of the name */
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .tile { rx: var(--radius-md); }
  .blue { fill: var(--accent-fill); }
  .tint { fill: var(--accent-soft); }
  .deep { fill: var(--ink-1); }
  .prod { fill: var(--stage-production); }
  .run { fill: var(--stage-runtime); }
  /* the stage disc, cut out of a block in the ground colour, or drawn on the ground in ink */
  .cut { fill: var(--surface-panel); }
  .cut-ring { fill: none; stroke: var(--surface-panel); stroke-width: 3; }
  .ink { fill: var(--ink-2); }
  .ink-ring { fill: none; stroke: var(--ink-2); stroke-width: 3; }
  .words { position: absolute; left: var(--space-6); right: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 80px; line-height: .92; font-weight: 700; letter-spacing: -.03em; color: var(--ink-1); }
  .tag { margin: var(--space-3) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent-fill 200×200 bled off the top (Bower blue, the one brand hue, largest) + one 96 cell · stage-production 2 cells wide bleeding right · stage-runtime 2 cells tall bleeding off the bottom · ink-1 one cell · accent-soft 2 cells wide (the tint) — about 37% of 960×288
  arrangement a flush thumbnail grid: cells of size-cell-min (96) on a space-2 gutter, some merged two-wide or two-tall like selected ranges, three cells left empty so the ground shows through
  pattern     the stage disc, from "物料阶段看填充多少": every cell carries one disc in its top-left corner — hollow, half or solid — exactly where the stage mark sits on a thumbnail; cut in the ground colour on blocks, drawn in ink-2 on empty cells (11 discs)
  scales      cell 96 = size-cell-min · gutter space-2 · disc inset space-3, diameter space-6 · tile corners radius-md
-->
<rect class="tile blue" x="16" y="-8" width="200" height="200" rx="8"/>
<rect class="tile deep" x="224" y="-8" width="96" height="96" rx="8"/>
<rect class="tile prod" x="328" y="-8" width="200" height="96" rx="8"/>
<rect class="tile run" x="224" y="96" width="96" height="200" rx="8"/>
<rect class="tile tint" x="328" y="96" width="200" height="96" rx="8"/>
<rect class="tile blue" x="16" y="200" width="96" height="96" rx="8"/>
<!-- discs: centre = cell origin + 24, r = 12 -->
<circle class="cut" cx="40" cy="16" r="12"/>
<circle class="cut-ring" cx="248" cy="16" r="10.5"/>
<g><circle class="cut-ring" cx="352" cy="16" r="10.5"/><path class="cut" d="M352 4a12 12 0 0 0 0 24Z"/></g>
<circle class="cut" cx="248" cy="120" r="12"/>
<g><circle class="ink-ring" cx="352" cy="120" r="10.5"/><path class="ink" d="M352 108a12 12 0 0 0 0 24Z"/></g>
<circle class="cut-ring" cx="40" cy="224" r="10.5"/>
<circle class="ink-ring" cx="144" cy="224" r="10.5"/>
<g><circle class="ink-ring" cx="352" cy="224" r="10.5"/><path class="ink" d="M352 212a12 12 0 0 0 0 24Z"/></g>
<circle class="ink" cx="456" cy="224" r="12"/>
<circle class="cut" cx="456" cy="16" r="12"/>
<circle class="ink-ring" cx="456" cy="120" r="10.5"/>
</svg>
</div>
<div class="words">
<h1 class="name">Bowerbird</h1>
<p class="tag">一个文件夹，就是整座资产库。</p>
</div>
</div>
</body>
</html>
