<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Dialog — preview</title>
<style>
  html, body { height: 100%; }
  body { position: relative; padding: var(--space-5); background: var(--surface-canvas); overflow: hidden; }
  #stage { display: flex; gap: var(--space-2); }
</style></head>
<body>
<div id="stage"></div>
<div id="host"></div>
<script>
  var B = Bowerbird, I = B.icon, H = B.html, D = B.demo;
  document.getElementById('stage').innerHTML = '<button class="bb-btn" data-open="ref">删除一个被引用的资产</button><button class="bb-btn" data-open="plain">删除一个没被引用的资产</button>';
  function row(n) { var a = D.byName(n); return H.row({ thumb: D.art(a.art, a), label: a.name, sub: a.path, trailing: H.stage(a.stage) + H.review(a.review) }); }
  function open(kind) {
    var ref = kind === 'ref';
    document.getElementById('host').innerHTML = '<div class="bb-scrim" data-close><div class="bb-dialog" role="alertdialog" aria-modal="true" aria-labelledby="dt">' +
      '<h2 class="bb-dialog__title" id="dt">把 ' + (ref ? 'chest_basecolor.png' : 'ref_clay_forms.png') + ' 移入回收站？</h2>' +
      '<p class="bb-dialog__text">' + (ref ? '有 1 个资产正在引用它。删除后这条引用会变成断链，并出现在「有问题」里。' : '没有其他资产引用它。') + '回收站保留 30 天，期间随时可以恢复到原位置。</p>' +
      (ref ? '<div class="bb-dialog__body"><div class="bb-label">引用它的资产</div><div class="bb-dialog__list">' + row('chest.glb') + '</div></div>' : '') +
      '<div class="bb-dialog__foot"><button class="bb-btn bb-btn--lg bb-btn--ghost" data-close>取消</button><button class="bb-btn bb-btn--lg bb-btn--danger" data-close>' + I('trash-2') + '移入回收站</button></div></div></div>';
    var btn = document.querySelector('.bb-dialog .bb-btn--ghost'); if (btn) btn.focus();
  }
  open('ref');
  document.addEventListener('click', function (e) {
    var o = e.target.closest('[data-open]'); if (o) return open(o.dataset.open);
    if (e.target.hasAttribute('data-close') || (e.target.closest('.bb-btn') && e.target.closest('.bb-dialog'))) document.getElementById('host').innerHTML = '';
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') document.getElementById('host').innerHTML = ''; });
</script>
</body>
</html>
